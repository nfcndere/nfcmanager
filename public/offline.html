<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f5f3d" />
    <title>Hors connexion · Ngaoundéré FC Admin</title>
    <style>
      :root {
        --nfc-green: #1f5f3d;
        --nfc-yellow: #8cea5a;
        --nfc-dark: #0c130e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: var(--nfc-dark);
        color: #ffffff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      main {
        max-width: 440px;
        width: 100%;
        border-top: 4px solid var(--nfc-yellow);
        background: #141f17;
        padding: 28px 24px;
      }
      .tag {
        color: var(--nfc-yellow);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 10px 0 8px;
        font-size: 24px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      p {
        margin: 0 0 20px;
        color: #d1d5db;
        font-size: 14px;
        line-height: 1.5;
      }
      a, button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 10px 18px;
        background: var(--nfc-yellow);
        color: var(--nfc-dark);
        border: 0;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="tag">Ngaoundéré FC · L’Étoile de l’Adamaoua</div>
      <h1>Vous êtes hors connexion</h1>
      <p>
        Cet écran n’a pas encore été mis en cache sur votre appareil. Vos brouillons et saisies de score
        enregistrés hors ligne sont conservés et seront synchronisés automatiquement dès le retour du réseau.
      </p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
    </main>
  </body>
</html>
