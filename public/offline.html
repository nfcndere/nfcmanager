<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f5f3d" />
    <title>Hors connexion · Ngaoundéré FC Manager</title>
    <style>
      :root {
        --bg: #ffffff;
        --card: #ffffff;
        --border: #e8e8e8;
        --text: #111111;
        --text-muted: #6e6e6e;
        --accent: #1f5f3d;
        --accent-contrast: #ffffff;
        --status-warning-bg: #fffbeb;
        --status-warning-text: #92400e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1511;
          --card: #151e18;
          --border: #24352b;
          --text: #f0f4f1;
          --text-muted: #95a89b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 420px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px 24px;
        text-align: center;
      }
      .icon-box {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: var(--status-warning-bg);
        color: var(--status-warning-text);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 20px;
        color: var(--text-muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      button, a {
        display: inline-flex;
        height: 40px;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }
      .btn-primary {
        background: var(--accent);
        color: var(--accent-contrast);
        border: 0;
      }
      .btn-secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
      button:active, a:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon-box" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>Vous êtes hors connexion</h1>
      <p>
        Les données précédemment consultées restent accessibles en cache. Vos modifications locales seront synchronisées dès le rétablissement de la connexion.
      </p>
      <div class="actions">
        <button type="button" class="btn-primary" onclick="window.location.reload()">
          Actualiser la page
        </button>
        <a href="/dashboard" class="btn-secondary">
          Aller au tableau de bord local
        </a>
      </div>
    </main>
  </body>
</html>
